
name: Workflow Triggers Demo

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  trigger-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger information
        run: |
          echo "Workflow triggered successfully!"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "User: ${{ github.actor }}"
