name: Module 4 - Variables and Secrets

on:
  push:
    branches:
      - main
  workflow_dispatch: # Added so you can run it manually if you want

jobs:
  variables-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Use Repository Variable
        run: |
          echo "The variable value is: ${{ vars.MY_VAR }}"

      - name: Use Encrypted Secret (Masked in logs)
        run: |
          echo "The secret value is: ${{ secrets.MY_SECRET }}"

      - name: Use GITHUB_TOKEN for API Authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching repository details via GitHub API..."
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/${{ github.repository }} | grep '"name":'